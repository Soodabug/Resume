  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"df46b524-5839-4560-a792-48e884e09c20\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --bg:#E7E3DA;          /* canvas behind the sheets */\n    --paper:#FBFAF7;       /* the page */\n    --ink:#16131D;\n    --ink-2:#4B4656;\n    --muted:#938D9C;\n    --violet:#4B35D6;      /* single accent */\n    --coral:#4B35D6;       /* mapped to accent */\n    --butter:#E6E1FB;      /* soft accent tint */\n    --mint:#4B35D6;        /* mapped to accent */\n    --line:#E7E2D8;\n    --line-2:#EFEBE3;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}\n  body{\n    font-family:\"Space Grotesk\",system-ui,sans-serif;\n    -webkit-font-smoothing:antialiased;\n    text-rendering:optimizeLegibility;\n    padding:32px 0 64px;\n  }\n  .stage{display:flex;flex-direction:column;align-items:center;gap:28px;}\n\n  .sheet{\n    width:210mm;\n    min-height:297mm;\n    background:var(--paper);\n    position:relative;\n    overflow:hidden;\n    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 24px 60px -28px rgba(22,19,29,.45);\n    padding:16mm 15mm 14mm;\n  }\n\n  /* ============ shared bits ============ */\n  .brandbar{display:flex;height:6px;border-radius:6px;overflow:hidden;}\n  .brandbar i{flex:1;}\n  .brandbar i:nth-child(1){background:var(--violet);}\n  .brandbar i:nth-child(2){background:var(--coral);}\n  .brandbar i:nth-child(3){background:var(--butter);}\n  .brandbar i:nth-child(4){background:var(--mint);}\n\n  .kicker{\n    font-family:\"JetBrains Mono\",monospace;\n    font-size:10px;letter-spacing:.24em;text-transform:uppercase;\n    color:var(--muted);\n  }\n  .sec-head{\n    display:flex;align-items:center;gap:12px;\n    margin:0 0 14px;\n  }\n  .sec-head h2{\n    font-family:\"Syne\",sans-serif;font-weight:800;\n    font-size:19px;letter-spacing:-.01em;margin:0;text-transform:uppercase;\n  }\n  .sec-head .ix{\n    font-family:\"JetBrains Mono\",monospace;font-size:11px;font-weight:500;\n    color:var(--violet);\n  }\n  .sec-head::after{\n    content:\"\";flex:1;height:2px;background:var(--line);border-radius:2px;\n  }\n\n  /* ============ HEADER ============ */\n  header.top{position:relative;}\n  .top .row1{\n    display:flex;justify-content:space-between;align-items:flex-start;gap:24px;\n  }\n  .badge{\n    display:inline-flex;align-items:center;gap:7px;\n    font-family:\"JetBrains Mono\",monospace;font-size:10px;letter-spacing:.18em;\n    text-transform:uppercase;color:#fff;\n    background:var(--ink);\n    padding:5px 10px;border-radius:100px;\n    font-weight:500;\n  }\n  .badge .pulse{width:7px;height:7px;border-radius:50%;background:#fff;}\n  .name{\n    font-family:\"Syne\",sans-serif;font-weight:800;\n    font-size:54px;line-height:.92;letter-spacing:-.03em;\n    margin:15px 0 0;\n  }\n  .name .l2{color:var(--violet);}\n  .role-line{\n    display:flex;align-items:center;gap:10px;margin-top:14px;\n  }\n  .role-line .tag{\n    font-family:\"Syne\",sans-serif;font-weight:700;font-size:15px;\n    letter-spacing:.0em;\n  }\n  .role-line .dot{width:5px;height:5px;border-radius:50%;background:var(--coral);}\n  .role-line .sub{\n    font-size:13px;color:var(--ink-2);font-weight:500;\n  }\n\n  .contact{\n    text-align:right;font-size:11.5px;color:var(--ink-2);\n    line-height:1.9;display:flex;flex-direction:column;gap:1px;font-weight:500;\n    flex-shrink:0;\n  }\n  .contact a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--line);padding-bottom:1px;white-space:nowrap;}\n  .contact a:hover{border-color:var(--coral);color:var(--coral);}\n  .contact .loc{color:var(--muted);font-family:\"JetBrains Mono\",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;}\n\n  .summary{\n    margin:22px 0 4px;\n    font-size:15px;line-height:1.6;color:var(--ink-2);\n    max-width:64ch;font-weight:500;\n  }\n  .summary b{color:var(--ink);font-weight:600;}\n  .lead{\n    font-family:\"Syne\",sans-serif;font-weight:700;\n    font-size:21px;line-height:1.3;color:var(--ink);\n    letter-spacing:-.01em;margin-bottom:10px;\n    text-wrap:balance;\n  }\n  .lead .hl{\n    background:linear-gradient(transparent 62%, var(--butter) 62%);\n    padding:0 2px;\n  }\n\n  /* ============ PROJECT CARDS ============ */\n  .work{margin-top:24px;}\n  .cards{display:flex;flex-direction:column;gap:16px;}\n  .card{\n    display:grid;grid-template-columns:1.05fr 1.3fr;\n    border:2px solid var(--ink);border-radius:18px;overflow:hidden;\n    background:#fff;\n    box-shadow:5px 6px 0 var(--shadow,#E7E2D8);\n  }\n  .card.v{--shadow:#DCD5F5;}\n  .card.c{--shadow:#DCD5F5;}\n  .card .shot{position:relative;background:var(--line-2);border-right:2px solid var(--ink);overflow:hidden;}\n  .card image-slot{display:block;width:100%;height:100%;min-height:188px;}\n\n  /* layered window mockup inside a card shot */\n  .mockwrap{position:absolute;inset:0;overflow:hidden;}\n  .win{position:absolute;border-radius:8px;overflow:hidden;\n    border:1px solid rgba(255,255,255,.16);\n    box-shadow:0 14px 30px -10px rgba(0,0,0,.65);}\n  .win .bar{height:15px;display:flex;align-items:center;gap:4px;padding:0 7px;\n    background:rgba(255,255,255,.07);}\n  .win .bar i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.32);}\n  .win img{display:block;width:100%;height:calc(100% - 15px);object-fit:cover;object-position:top center;}\n  .win.back{width:58%;height:54%;top:12%;left:4%;transform:rotate(-4deg);opacity:.72;filter:blur(0.6px) saturate(.95);}\n  .win.back::after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,32,.12),rgba(10,18,32,.34));}\n  .win.front{width:74%;height:65%;bottom:10%;right:5%;}\n  .card.v .shot{background:radial-gradient(120% 120% at 70% 0%, #16263f 0%, #0c1626 60%, #0a1220 100%);}\n  .card.c .shot{background:radial-gradient(120% 120% at 70% 0%, #f3ece4 0%, #e7dccd 100%);}\n  /* light-screenshot windows (Pierland) */\n  .card.c .win{border-color:rgba(28,40,30,.14);box-shadow:0 14px 30px -10px rgba(40,55,42,.4);}\n  .card.c .win .bar{background:rgba(28,40,30,.06);}\n  .card.c .win .bar i{background:rgba(28,40,30,.22);}\n  .card.c .win.back::after{background:linear-gradient(180deg,rgba(231,220,205,.12),rgba(231,220,205,.4));}\n  .card .meta{padding:18px 18px 16px;display:flex;flex-direction:column;}\n  .card .ptag{\n    align-self:flex-start;\n    font-family:\"JetBrains Mono\",monospace;font-size:9.5px;letter-spacing:.16em;\n    text-transform:uppercase;font-weight:500;color:#fff;\n    padding:4px 9px;border-radius:100px;margin-bottom:10px;\n  }\n  .card.v .ptag{background:var(--violet);}\n  .card.c .ptag{background:var(--coral);}\n  .card h3{\n    font-family:\"Syne\",sans-serif;font-weight:800;font-size:21px;\n    line-height:1.08;letter-spacing:-.02em;margin:0 0 6px;\n  }\n  .card p{margin:0 0 12px;font-size:12.5px;line-height:1.5;color:var(--ink-2);font-weight:500;}\n  .card .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}\n  .card .chips span{\n    font-size:10.5px;font-weight:600;color:var(--ink-2);\n    border:1.5px solid var(--line);background:var(--paper);\n    padding:3px 8px;border-radius:100px;\n  }\n  .card .cta{\n    margin-top:auto;align-self:flex-start;\n    display:inline-flex;align-items:center;gap:8px;\n    font-family:\"Space Grotesk\";font-weight:700;font-size:12.5px;\n    color:#fff;background:var(--ink);\n    padding:9px 14px;border-radius:100px;text-decoration:none;\n    transition:transform .15s ease, background .15s ease;\n  }\n  .card .cta:hover{transform:translateY(-1px);}\n  .card.v .cta:hover{background:var(--violet);}\n  .card.c .cta:hover{background:var(--coral);}\n  .card .cta .arr{font-size:14px;}\n\n  /* ============ SKILLS STRIP ============ */\n  .skills{margin-top:22px;}\n  .skillgrid{display:flex;flex-wrap:wrap;gap:7px;}\n  .skillgrid span{\n    font-size:12px;font-weight:600;\n    padding:6px 12px;border-radius:100px;\n    border:2px solid var(--ink);\n  }\n  .skillgrid span.s-v{background:#F1EEFC;}\n  .skillgrid span.s-c{background:#fff;}\n  .skillgrid span.s-y{background:#F1EEFC;}\n  .skillgrid span.s-m{background:#fff;}\n  .skillgrid span.s-n{background:#fff;}\n\n  /* ============ PAGE 2: EXPERIENCE ============ */\n  .exp{display:flex;flex-direction:column;}\n  .job{\n    display:grid;grid-template-columns:118px 1fr;gap:18px;\n    padding:14px 0;border-top:2px solid var(--line);\n  }\n  .job:first-of-type{border-top:2px solid var(--ink);}\n  .job .when{\n    font-family:\"JetBrains Mono\",monospace;font-size:11px;color:var(--ink-2);\n    font-weight:500;padding-top:3px;\n  }\n  .job .when .live{\n    display:inline-block;margin-top:7px;font-size:8.5px;letter-spacing:.16em;\n    text-transform:uppercase;background:var(--mint);color:#fff;\n    padding:2px 7px;border-radius:100px;font-weight:500;\n  }\n  .job h3{\n    font-family:\"Syne\",sans-serif;font-weight:700;font-size:17px;\n    margin:0 0 1px;letter-spacing:-.01em;\n  }\n  .job h3 em{font-style:normal;color:var(--muted);font-size:12px;font-weight:500;font-family:\"Space Grotesk\";}\n  .job .co{\n    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;\n    color:var(--violet);margin-bottom:7px;\n  }\n  .job.c2 .co{color:var(--coral);}\n  .job ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;}\n  .job ul li{\n    position:relative;padding-left:16px;font-size:12px;line-height:1.5;\n    color:var(--ink-2);font-weight:500;\n  }\n  .job ul li::before{\n    content:\"\";position:absolute;left:0;top:8px;width:7px;height:2px;\n    background:var(--coral);border-radius:2px;\n  }\n\n  /* ============ LOWER GRID ============ */\n  .lower{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:24px;}\n  .block h2.mini{\n    font-family:\"Syne\",sans-serif;font-weight:800;font-size:13px;\n    text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;\n    padding-bottom:8px;border-bottom:2px solid var(--ink);\n    display:flex;align-items:center;gap:8px;\n  }\n  .block h2.mini .sq{width:9px;height:9px;border-radius:2px;}\n  .block + .block{margin-top:22px;}\n\n  .edu-item{margin-bottom:13px;}\n  .edu-item .yr{font-family:\"JetBrains Mono\",monospace;font-size:10px;color:var(--muted);letter-spacing:.08em;}\n  .edu-item .deg{font-family:\"Syne\",sans-serif;font-weight:700;font-size:15px;line-height:1.2;margin:2px 0 1px;}\n  .edu-item .uni{font-size:11.5px;color:var(--ink-2);font-weight:500;}\n  .edu-item .cw{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.45;border-left:2px solid var(--violet);padding-left:8px;font-weight:500;}\n\n  .certs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;}\n  .certs li{border-bottom:1.5px dashed var(--line);}\n  .certs li:last-child{border-bottom:none;}\n  .cert-link{display:flex;justify-content:space-between;align-items:baseline;gap:10px;\n    text-decoration:none;color:inherit;padding:7px 0;transition:padding .15s ease;}\n  .cert-link:hover{padding-left:4px;}\n  .cert-link b{font-weight:600;font-size:12px;color:var(--ink);}\n  .cert-link:hover b{color:var(--violet);}\n  .cert-link .src{font-family:\"JetBrains Mono\",monospace;font-size:9px;color:var(--muted);white-space:nowrap;letter-spacing:.06em;}\n\n  .toolset{display:flex;flex-direction:column;gap:9px;}\n  .toolrow .lab{font-family:\"JetBrains Mono\",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);margin-bottom:4px;font-weight:500;}\n  .toolrow .val{font-size:12px;color:var(--ink-2);font-weight:500;}\n\n  .langs{display:flex;flex-direction:column;gap:11px;}\n  .lang{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;}\n  .lang .nm{font-size:12.5px;font-weight:600;}\n  .lang .lvl{font-family:\"JetBrains Mono\",monospace;font-size:9.5px;color:var(--muted);letter-spacing:.08em;}\n  .lang .bar{grid-column:1/-1;height:5px;background:var(--line-2);border-radius:100px;overflow:hidden;}\n  .lang .bar i{display:block;height:100%;border-radius:100px;}\n\n  /* footer */\n  .pgfoot{\n    position:absolute;left:15mm;right:15mm;bottom:9mm;\n    display:flex;justify-content:space-between;align-items:center;\n    font-family:\"JetBrains Mono\",monospace;font-size:9px;letter-spacing:.16em;\n    text-transform:uppercase;color:var(--muted);\n    padding-top:9px;border-top:2px solid var(--line);\n  }\n\n  /* ============ PRINT ============ */\n  @media print{\n    @page{size:A4;margin:0;}\n    html,body{background:#fff;padding:0;margin:0;\n      -webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}\n    .stage{gap:0;}\n    .sheet{\n      box-shadow:none;margin:0;\n      width:210mm;height:297mm;\n      page-break-after:always;break-after:page;\n    }\n    .sheet:last-child{page-break-after:auto;break-after:auto;}\n    .card .cta:hover,.cert-link:hover{transform:none;padding-left:0;}\n  }\n\n  /* screen scaling for small viewports — JS sets --fit on each sheet */\n  .sheet-frame{display:flex;justify-content:center;overflow:hidden;}\n  @media (max-width:840px){\n    body{padding:16px 0;}\n    .stage{gap:16px;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"stage\">\n\n  <!-- ===================== PAGE 1 ===================== -->\n  <section class=\"sheet\" data-screen-label=\"Page 1\">\n    <header class=\"top\">\n      <div class=\"row1\">\n        <div>\n          <h1 class=\"name\">Soodabeh<br><span class=\"l2\">Malekzadeh<\u002Fspan><\u002Fh1>\n          <div class=\"role-line\">\n            <span class=\"tag\">UI/UX &amp; Product Designer<\u002Fspan>\n            <span class=\"dot\"><\u002Fspan>\n            <span class=\"sub\">Figma → React / TypeScript<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"contact\">\n          <span class=\"loc\">Genoa, Italy<\u002Fspan>\n          <a href=\"mailto:soode.malek@gmail.com\">soode.malek@gmail.com<\u002Fa>\n          <span>+39&nbsp;334&nbsp;1979969<\u002Fspan>\n          <a href=\"https://linkedin.com/in/soodabehmalekzadeh\" target=\"_blank\" rel=\"noopener\">in/soodabehmalekzadeh<\u002Fa>\n          <a href=\"https://dribbble.com/soodeui\" target=\"_blank\" rel=\"noopener\">dribbble/soodeui<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"brandbar\" style=\"margin-top:20px\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n\n      <p class=\"summary\">\n        <span class=\"lead\">A designer who turns visual craft into <span class=\"hl\">usable, brand-aligned<\u002Fspan> digital products — and helps ship them.<\u002Fspan>\n        UI/UX Designer with a background in graphic design and <b>6+ years<\u002Fb> creating user-friendly, visually clear interfaces. Since moving into UI/UX in 2021 I've worked on web and product projects spanning wireframing, prototyping, design systems, user flows and responsive layouts — backed by working knowledge of <b>HTML, CSS, React &amp; TypeScript<\u002Fb> that closes the design-to-development gap.\n      <\u002Fp>\n    <\u002Fheader>\n\n    <!-- SELECTED WORK -->\n    <div class=\"work\">\n      <div class=\"sec-head\"><span class=\"ix\">01<\u002Fspan><h2>Selected&nbsp;Work<\u002Fh2><\u002Fdiv>\n\n      <div class=\"cards\">\n\n        <article class=\"card v\">\n          <div class=\"shot\">\n            <div class=\"mockwrap\">\n              <div class=\"win back\"><div class=\"bar\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv><img src=\"5477673b-7fc1-4a60-a2b5-129adf56cb6c\" alt=\"Motiview questionnaire screen\"><\u002Fdiv>\n              <div class=\"win front\"><div class=\"bar\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv><img src=\"a1225af2-1ce2-46b2-bdbb-152a35973786\" alt=\"Motiview landing screen\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"meta\">\n            <span class=\"ptag\">B2C Platform · Product UI<\u002Fspan>\n            <h3>Neurolytics B2C Platform<\u002Fh3>\n            <p>End-to-end UI for a consumer assessment platform — research, screen structure, hi-fi design and a reusable component library, informed by the existing B2B flow but rebuilt for a new audience.<\u002Fp>\n            <div class=\"chips\"><span>Figma<\u002Fspan><span>Design System<\u002Fspan><span>Prototyping<\u002Fspan><span>React<\u002Fspan><\u002Fdiv>\n            <a class=\"cta\" href=\"https://www.figma.com/design/NYIsqWV1w94E55hLYiT7oU/Motiview\" target=\"_blank\" rel=\"noopener\">Open in Figma <span class=\"arr\">↗<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"card c\">\n          <div class=\"shot\">\n            <div class=\"mockwrap\">\n              <div class=\"win back\"><div class=\"bar\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv><img src=\"43a85429-6acf-4018-87d4-10229c796aff\" alt=\"Pierland cart screen\"><\u002Fdiv>\n              <div class=\"win front\"><div class=\"bar\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv><img src=\"55b3b1d3-0cf3-4d04-bc09-4f1a468f1683\" alt=\"Pierland product page\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"meta\">\n            <span class=\"ptag\">E-commerce · UI/UX Case Study<\u002Fspan>\n            <h3>Pierland Perfume Website<\u002Fh3>\n            <p>A UI/UX case study for an e-commerce perfume brand — improving product presentation, visual hierarchy and a consistent, conversion-minded shopping experience across the journey.<\u002Fp>\n            <div class=\"chips\"><span>Figma<\u002Fspan><span>UX Flows<\u002Fspan><span>Visual Design<\u002Fspan><span>Responsive<\u002F scale >= 0.999){\n        s.style.transform='';\n        frame.style.width=''; frame.style.height='';\n      } else {\n        s.style.transformOrigin='top left';\n        s.style.transform='scale('+scale+')';\n        frame.style.width=(natW*scale)+'px';\n        frame.style.height=(natH*scale)+'px';\n      }\n    }\n  }\n  window.addEventListener('resize', fit);\n  window.addEventListener('orientationchange', fit);\n  window.addEventListener('load', fit);\n  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fit); }\n  fit();\n  setTimeout(fit, 400);\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
